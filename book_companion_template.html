<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Companion</title>
<style>
  :root{
    --ink:#161f2e;
    --ink-2:#1e2a3d;
    --paper:#f3efe3;
    --paper-dim:#c9c2ad;
    --amber:#e8a33d;
    --amber-dim:#a97a2f;
    --slate:#7c8aa0;
    --good:#5fae7a;
    --bad:#d16d6d;
    --serif: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    /* One font family throughout. Hierarchy comes from size and weight, not typeface switching. */
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--paper);
    font-family:var(--sans);
    min-height:100vh;
  }
  .wrap{
    max-width:1160px;
    margin:0 auto;
    padding:32px 20px 80px;
    display:flex;
    gap:32px;
    align-items:flex-start;
  }
  .sidebar{
    width:220px;
    flex-shrink:0;
    position:sticky;
    top:32px;
    overflow:hidden;
    transition:width .2s ease, opacity .2s ease, margin .2s ease;
  }
  .wrap.collapsed .sidebar{
    width:0;
    opacity:0;
    pointer-events:none;
  }
  .wrap.collapsed{ gap:0; }
  .sidebar-label{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:11px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--slate);
    margin-bottom:12px;
    white-space:nowrap;
  }
  .sidebar-collapse-btn{
    background:transparent;
    border:1px solid rgba(240,237,228,0.2);
    color:var(--slate);
    font-size:11px;
    padding:3px 7px;
    border-radius:5px;
    cursor:pointer;
    line-height:1;
  }
  .sidebar-collapse-btn:hover{ border-color:var(--amber); color:var(--amber); }
  .sidebar-expand-btn{
    display:none;
    background:var(--ink-2);
    border:1px solid rgba(240,237,228,0.15);
    color:var(--paper-dim);
    font-family:var(--sans);
    font-size:12px;
    padding:7px 12px;
    border-radius:7px;
    cursor:pointer;
    margin-bottom:16px;
    align-items:center;
    gap:6px;
  }
  .sidebar-expand-btn:hover{ border-color:var(--amber); color:var(--amber); }
  .wrap.collapsed .sidebar-expand-btn{ display:inline-flex; }
  .chapter-tab{
    display:block;
    width:100%;
    text-align:left;
    background:transparent;
    border:none;
    border-left:2px solid rgba(240,237,228,0.12);
    color:var(--paper-dim);
    font-family:var(--sans);
    font-size:13.5px;
    line-height:1.4;
    padding:10px 14px;
    cursor:pointer;
    margin-bottom:2px;
    white-space:nowrap;
  }
  .chapter-tab .num{
    display:block;
    font-size:10.5px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--slate);
    margin-bottom:2px;
  }
  .chapter-tab.active{
    border-left:2px solid var(--amber);
    color:var(--paper);
    background:rgba(232,163,61,0.06);
  }
  .chapter-tab.active .num{ color:var(--amber); }
  .chapter-tab:hover:not(.active){
    background:rgba(240,237,228,0.04);
    color:var(--paper);
  }
  .main-col{
    flex:1;
    min-width:0;
  }
  @media (max-width:760px){
    .wrap{ flex-direction:column; }
    .wrap.collapsed{ gap:32px; }
    .sidebar{ width:100%; position:static; }
    .wrap.collapsed .sidebar{ width:100%; opacity:1; pointer-events:auto; display:none; }
    .sidebar-expand-btn{ margin-bottom:16px; }
    .chapter-tab{ display:inline-block; width:auto; border-left:none; border-bottom:2px solid rgba(240,237,228,0.12); margin-right:6px; }
    .chapter-tab.active{ border-left:none; border-bottom:2px solid var(--amber); }
  }
  header.top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    border-bottom:1px solid rgba(240,237,228,0.15);
    padding-bottom:14px;
    margin-bottom:28px;
  }
  header.top .kicker{
    font-family:var(--sans);
    letter-spacing:0.14em;
    text-transform:uppercase;
    font-size:11px;
    color:var(--amber);
  }
  header.top h1{
    font-size:21px;
    margin:4px 0 0;
    font-weight:700;
    color:var(--paper);
  }
  .mode-toggle{
    display:flex;
    gap:8px;
  }
  .mode-toggle button{
    background:transparent;
    border:1px solid rgba(240,237,228,0.25);
    color:var(--paper-dim);
    font-family:var(--sans);
    font-size:12px;
    padding:7px 14px;
    border-radius:999px;
    cursor:pointer;
    transition:all .15s;
  }
  .mode-toggle button.active{
    background:var(--amber);
    border-color:var(--amber);
    color:var(--ink);
    font-weight:600;
  }

  /* ===== SLIDES ===== */
  #slides{display:block;}
  #quiz{display:none;}

  .concept-thread{
    display:flex;
    align-items:center;
    gap:6px;
    flex-wrap:wrap;
    font-size:11px;
    color:var(--slate);
    margin-bottom:22px;
    padding-bottom:14px;
    border-bottom:1px dashed rgba(240,237,228,0.12);
  }
  .concept-thread .node{
    padding:3px 9px;
    border-radius:4px;
    border:1px solid rgba(124,138,160,0.4);
    white-space:nowrap;
  }
  .concept-thread .node.done{ color:var(--amber); border-color:var(--amber-dim); }
  .concept-thread .arrow{ color:var(--slate); }

  .slide{
    background:var(--ink-2);
    border:1px solid rgba(240,237,228,0.08);
    border-radius:10px;
    padding:38px 42px;
    min-height:420px;
    display:flex;
    flex-direction:column;
    justify-content:center;
  }
  .slide .eyebrow{
    font-size:11px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--amber);
    margin-bottom:10px;
  }
  .slide h2{
    font-size:27px;
    margin:0 0 18px;
    line-height:1.3;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  .slide p{
    font-size:16px;
    line-height:1.7;
    color:#dcd8c9;
    margin:0 0 14px;
  }
  .slide .callout{
    background:rgba(232,163,61,0.08);
    border-left:3px solid var(--amber);
    padding:12px 16px;
    border-radius:4px;
    font-size:14.5px;
    color:var(--paper);
    margin-top:10px;
  }
  .slide .example{
    background:rgba(20,28,42,0.6);
    border:1px solid rgba(240,237,228,0.1);
    border-radius:6px;
    padding:14px 18px;
    font-family:var(--sans);
    font-size:14px;
    color:var(--paper-dim);
    margin-top:12px;
    line-height:1.7;
  }
  .slide .diagram{
    margin-top:14px;
    background:rgba(20,28,42,0.4);
    border:1px solid rgba(240,237,228,0.08);
    border-radius:8px;
    padding:16px;
  }
  .slide svg text{ font-family:var(--sans); }
  .slide .dcap{
    font-size:12px;
    color:var(--slate);
    text-align:center;
    margin-top:8px;
  }
  /* Standalone SVG diagram colors, hardcoded so they render outside any special runtime */
  .dteal rect{ fill:rgba(95,174,122,0.16); stroke:#5fae7a; }
  .dteal text{ fill:#cfe8d9; }
  .damber rect{ fill:rgba(232,163,61,0.22); stroke:#e8a33d; }
  .damber text{ fill:#f6dcae; }
  .dgray rect{ fill:rgba(124,138,160,0.14); stroke:#7c8aa0; }
  .dgray text{ fill:#c6cdd9; }
  .dsvg-label{ fill:#dcd8c9; }
  .dsvg-sub{ fill:#9aa4b5; font-size:12px; }
  .slide svg .t{ font-size:14px; }
  .slide svg .th{ font-size:14px; font-weight:700; }
  .slide svg .ts{ font-size:12px; }
  .slide svg .arr{ stroke:#7c8aa0; stroke-width:1.2; fill:none; }
  .slide svg text:not(.dteal text):not(.damber text):not(.dgray text){ fill:#dcd8c9; }
  .grid2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
    margin-top:14px;
  }
  .card{
    background:rgba(20,28,42,0.5);
    border:1px solid rgba(240,237,228,0.1);
    border-radius:8px;
    padding:16px 18px;
  }
  .card h3{
    font-size:14.5px;
    margin:0 0 6px;
    color:var(--amber);
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.02em;
  }
  .card p{ font-size:13.5px; margin:0; }
  ul.plain{ padding-left:20px; margin:10px 0; }
  ul.plain li{ font-size:15px; line-height:1.7; color:#dcd8c9; margin-bottom:6px; }

  .nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:22px;
  }
  .nav button{
    background:var(--ink-2);
    border:1px solid rgba(240,237,228,0.2);
    color:var(--paper);
    font-family:var(--sans);
    padding:10px 20px;
    border-radius:7px;
    cursor:pointer;
    font-size:14px;
  }
  .nav button:disabled{ opacity:0.3; cursor:default; }
  .nav button:not(:disabled):hover{ border-color:var(--amber); color:var(--amber); }
  .dots{ display:flex; gap:6px; }
  .dot{
    width:7px; height:7px; border-radius:50%;
    background:rgba(240,237,228,0.2);
    transition:all .2s;
  }
  .dot.active{ background:var(--amber); width:20px; border-radius:4px; }

  /* ===== QUIZ ===== */
  .quiz-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding-bottom:16px;
    margin-bottom:20px;
    border-bottom:1px solid rgba(240,237,228,0.12);
  }
  .quiz-head-title{
    font-size:15px;
    font-weight:700;
    color:var(--paper);
  }
  .reset-btn{
    background:transparent;
    border:1px solid rgba(240,237,228,0.25);
    color:var(--paper-dim);
    font-family:var(--sans);
    font-size:12.5px;
    padding:7px 14px;
    border-radius:7px;
    cursor:pointer;
  }
  .reset-btn:hover{ border-color:var(--amber); color:var(--amber); }
  .qcard{
    background:var(--ink-2);
    border:1px solid rgba(240,237,228,0.08);
    border-radius:10px;
    padding:26px 30px;
    margin-bottom:16px;
  }
  .qcard .qnum{
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--amber);
    margin-bottom:8px;
  }
  .qcard h3{
    font-weight:600;
    font-size:17px;
    margin:0 0 16px;
    line-height:1.5;
  }
  .opt{
    display:block;
    width:100%;
    text-align:left;
    background:rgba(20,28,42,0.5);
    border:1px solid rgba(240,237,228,0.15);
    color:var(--paper);
    padding:12px 16px;
    border-radius:7px;
    margin-bottom:8px;
    cursor:pointer;
    font-size:14.5px;
    font-family:var(--sans);
    transition:all .12s;
  }
  .opt:hover{ border-color:var(--amber); }
  .opt.correct{ border-color:var(--good); background:rgba(95,174,122,0.12); }
  .opt.incorrect{ border-color:var(--bad); background:rgba(209,109,109,0.12); }
  .opt:disabled{ cursor:default; }
  .explain{
    display:none;
    margin-top:10px;
    padding:12px 16px;
    background:rgba(232,163,61,0.06);
    border-left:3px solid var(--amber);
    border-radius:4px;
    font-size:13.5px;
    line-height:1.6;
    color:var(--paper-dim);
  }
  .score-bar{
    text-align:center;
    padding:20px;
    font-family:var(--serif);
    font-size:17px;
    color:var(--amber);
  }
</style>
</head>
<body>
<div class="wrap" id="wrap">

  <aside class="sidebar">
    <div class="sidebar-label">
      Chapters
      <button class="sidebar-collapse-btn" onclick="toggleSidebar()" aria-label="Hide chapter list">← Hide</button>
    </div>
    <div id="chapterRow"></div>
  </aside>

  <div class="main-col">

    <button class="sidebar-expand-btn" onclick="toggleSidebar()" aria-label="Show chapter list">☰ Chapters</button>

    <header class="top">
      <div>
        <div class="kicker">[BOOK TITLE], study companion</div>
        <h1 id="chapterTitle">[First Chapter Title]</h1>
      </div>
      <div class="mode-toggle">
        <button id="btnSlides" class="active" onclick="showMode('slides')">Lesson</button>
        <button id="btnQuiz" onclick="showMode('quiz')">Quiz</button>
      </div>
    </header>

    <!-- ============ SLIDES ============ -->
    <div id="slides">
      <div class="concept-thread" id="thread"></div>
      <div id="slideHost"></div>
      <div class="nav">
        <button id="prevBtn" onclick="go(-1)">← Back</button>
        <div class="dots" id="dots"></div>
        <button id="nextBtn" onclick="go(1)">Next →</button>
      </div>
    </div>

    <!-- ============ QUIZ ============ -->
    <div id="quiz"></div>

  </div>
</div>

<script>
/* ============================================================
   TEMPLATE CHAPTER DATA
   Copy this whole block once per chapter, rename ch1 -> ch2, ch3, etc.
   Delete this example content and replace with real chapter content.
   ============================================================ */

const ch1_slides = [
{
  eyebrow:"Section label shown above the title",
  title:"The slide's main teaching point, as a full clear sentence",
  body:`
    <p>Opening sentence that frames the idea. Keep sentences under
    30 words and one idea each.</p>
    <div class="grid2">
      <div class="card"><h3>Concept A</h3><p>Short explanation with a concrete anchor, a real number or named example.</p></div>
      <div class="card"><h3>Concept B</h3><p>Short explanation with a concrete anchor, a real number or named example.</p></div>
    </div>
    <div class="callout">Use this box for the one non-obvious insight on the slide, the thing worth remembering most.</div>
  `
},
{
  eyebrow:"Example alternate layout",
  title:"Use a plain list when order or steps matter",
  body:`
    <p>Short framing sentence.</p>
    <ul class="plain">
      <li><b>Step or point one.</b> Detail with a concrete anchor.</li>
      <li><b>Step or point two.</b> Detail with a concrete anchor.</li>
      <li><b>Step or point three.</b> Detail with a concrete anchor.</li>
    </ul>
  `
},
{
  eyebrow:"Example diagram slide",
  title:"Use a custom SVG only for genuinely spatial or relational ideas",
  body:`
    <div class="diagram">
      <svg width="100%" viewBox="0 0 680 200" role="img">
        <title>Short accessible title for the diagram</title>
        <desc>One sentence describing what the diagram shows, for screen readers</desc>
        <g class="dteal"><rect x="40" y="60" width="160" height="60" rx="8" stroke-width="0.5"/>
          <text class="th" x="120" y="90" text-anchor="middle" dominant-baseline="central">Box label</text>
        </g>
        <text class="ts dsvg-sub" x="120" y="150" text-anchor="middle">Dim caption text goes here, outside any colored box</text>
      </svg>
    </div>
    <p>Follow-up paragraph explaining the diagram's significance.</p>
  `
},
{
  eyebrow:"Closing slide of the chapter",
  title:"The throughline of this chapter",
  body:`
    <p>One sentence framing the chapter's central question.</p>
    <div class="callout">
    A single connected paragraph chaining the chapter's ideas together in
    logical order, this is the summary students will reread most.
    </div>
  `
}
];

const ch1_quiz = [
{
  type:'mc',
  q:"A single-answer multiple choice question testing one concept from a slide above.",
  options:[
    "The correct answer",
    "A plausible but wrong distractor",
    "Another plausible but wrong distractor",
    "A third plausible but wrong distractor"
  ],
  correct:0,
  explain:"Explanation of why the correct answer is right, referencing the specific fact or example from the slide."
},
{
  type:'multi',
  q:"Select all statements that are true. (More than one is correct.)",
  options:[
    "A true statement",
    "A false statement",
    "Another true statement",
    "Another false statement"
  ],
  correctSet:[0,2],
  explain:"Explanation covering why the correct options are right and the incorrect ones are wrong."
},
{
  type:'scenario',
  q:"Scenario: a short applied situation. Which concept from the chapter does this best illustrate?",
  options:[
    "The correct concept",
    "A plausible but wrong distractor",
    "Another plausible but wrong distractor",
    "A third plausible but wrong distractor"
  ],
  correct:0,
  explain:"Explanation connecting the scenario back to the specific concept and why it applies here."
}
];

/* ============================================================
   END TEMPLATE CHAPTER. Duplicate the block above for ch2, ch3, etc.,
   then update the registry below to list every chapter.
   ============================================================ */

const chapters = [
  {
    id:1,
    title:"[First Chapter Title]",
    threadNodes:["Concept A","Concept B","Concept C","Concept D"],
    slides:ch1_slides,
    quiz:ch1_quiz
  }
  /* Add one object per chapter here, e.g.:
  {
    id:2,
    title:"[Second Chapter Title]",
    threadNodes:["...","...","..."],
    slides:ch2_slides,
    quiz:ch2_quiz
  },
  */
];

let activeChapter = 0;
let idx = 0;

function renderChapterRow(){
  const row = document.getElementById('chapterRow');
  row.innerHTML = chapters.map((c,i)=>
    `<button class="chapter-tab ${i===activeChapter?'active':''}" onclick="switchChapter(${i})">
      <span class="num">Chapter ${c.id}</span>${c.title}
    </button>`
  ).join('');
}

function switchChapter(i){
  activeChapter = i;
  idx = 0;
  document.getElementById('chapterTitle').innerText = chapters[i].title;
  renderChapterRow();
  renderSlide();
  renderQuiz();
  showMode('slides');
  document.getElementById('btnSlides').classList.add('active');
  document.getElementById('btnQuiz').classList.remove('active');
}

/* ---------------- SLIDE RENDERING ---------------- */
function renderThread(){
  const t = document.getElementById('thread');
  const nodes = chapters[activeChapter].threadNodes;
  t.innerHTML = nodes.map((n,i)=>{
    const doneClass = i <= currentThreadStage() ? 'done' : '';
    return `<span class="node ${doneClass}">${n}</span>` + (i<nodes.length-1 ? `<span class="arrow">→</span>` : '');
  }).join('');
}
function currentThreadStage(){
  const slides = chapters[activeChapter].slides;
  const stageCount = chapters[activeChapter].threadNodes.length;
  return Math.min(stageCount - 1, Math.floor((idx / slides.length) * stageCount));
}

function renderSlide(){
  const slides = chapters[activeChapter].slides;
  const s = slides[idx];
  document.getElementById('slideHost').innerHTML = `
    <div class="slide">
      <div class="eyebrow">${s.eyebrow}</div>
      <h2>${s.title}</h2>
      ${s.body}
    </div>
  `;
  document.getElementById('prevBtn').disabled = idx===0;
  document.getElementById('nextBtn').disabled = idx===slides.length-1;
  document.getElementById('nextBtn').innerText = idx===slides.length-1 ? 'Done' : 'Next →';
  renderDots();
  renderThread();
  window.scrollTo({top:0, behavior:'smooth'});
}
function renderDots(){
  const slides = chapters[activeChapter].slides;
  document.getElementById('dots').innerHTML = slides.map((_,i)=>
    `<div class="dot ${i===idx?'active':''}"></div>`
  ).join('');
}
function go(dir){
  const slides = chapters[activeChapter].slides;
  const next = idx + dir;
  if(next>=0 && next<slides.length){ idx = next; renderSlide(); }
}

/* ---------------- MODE TOGGLE ---------------- */
function showMode(mode){
  document.getElementById('slides').style.display = mode==='slides' ? 'block' : 'none';
  document.getElementById('quiz').style.display = mode==='quiz' ? 'block' : 'none';
  document.getElementById('btnSlides').classList.toggle('active', mode==='slides');
  document.getElementById('btnQuiz').classList.toggle('active', mode==='quiz');
  window.scrollTo({top:0, behavior:'smooth'});
}

function toggleSidebar(){
  document.getElementById('wrap').classList.toggle('collapsed');
}

/* ---------------- QUIZ ---------------- */
function renderQuiz(){
  const quizData = chapters[activeChapter].quiz;
  const host = document.getElementById('quiz');
  let html = `<div class="quiz-head">
    <div class="quiz-head-title">${chapters[activeChapter].title}</div>
    <button class="reset-btn" onclick="resetQuiz()">Retake quiz</button>
  </div>`;
  quizData.forEach((item, i)=>{
    const tag = item.type==='scenario' ? ' · Applied' : (item.type==='multi' ? ' · Select all that apply' : '');
    html += `<div class="qcard" id="q${i}">
      <div class="qnum">Question ${i+1} of ${quizData.length}${tag}</div>
      <h3>${item.q}</h3>`;
    if(item.type==='multi'){
      item.options.forEach((opt, oi)=>{
        html += `<label class="opt" id="opt${i}_${oi}" style="display:flex;align-items:center;gap:10px;cursor:pointer;">
          <input type="checkbox" id="chk${i}_${oi}" style="width:16px;height:16px;flex-shrink:0;">
          <span>${opt}</span>
        </label>`;
      });
      html += `<button onclick="submitMulti(${i})" style="margin-top:8px;background:var(--amber);border:none;color:var(--ink);font-weight:700;padding:9px 18px;border-radius:7px;cursor:pointer;font-size:13.5px;" id="submitBtn${i}">Check answer</button>`;
      html += `<div class="explain" id="exp${i}">${item.explain}</div>`;
    } else {
      item.options.forEach((opt, oi)=>{
        html += `<button class="opt" id="opt${i}_${oi}" onclick="answer(${i},${oi})">${opt}</button>`;
      });
      html += `<div class="explain" id="exp${i}">${item.explain}</div>`;
    }
    html += `</div>`;
  });
  host.innerHTML = html;
}

function resetQuiz(){
  renderQuiz();
  window.scrollTo({top:0, behavior:'smooth'});
}

function answer(qi, oi){
  const quizData = chapters[activeChapter].quiz;
  const item = quizData[qi];
  for(let o=0;o<item.options.length;o++){
    const btn = document.getElementById(`opt${qi}_${o}`);
    btn.disabled = true;
    if(o===item.correct) btn.classList.add('correct');
    else if(o===oi) btn.classList.add('incorrect');
  }
  document.getElementById(`exp${qi}`).style.display = 'block';
}

function submitMulti(qi){
  const quizData = chapters[activeChapter].quiz;
  const item = quizData[qi];
  const correctSet = new Set(item.correctSet);
  item.options.forEach((opt, oi)=>{
    const chk = document.getElementById(`chk${qi}_${oi}`);
    const label = document.getElementById(`opt${qi}_${oi}`);
    chk.disabled = true;
    const picked = chk.checked;
    const shouldBeChecked = correctSet.has(oi);
    if(shouldBeChecked && picked) label.classList.add('correct');
    else if(shouldBeChecked && !picked) label.classList.add('correct');
    else if(!shouldBeChecked && picked) label.classList.add('incorrect');
  });
  document.getElementById(`submitBtn${qi}`).disabled = true;
  document.getElementById(`submitBtn${qi}`).style.opacity = '0.4';
  document.getElementById(`exp${qi}`).style.display = 'block';
}

/* ---------------- INIT ---------------- */
renderChapterRow();
renderSlide();
renderQuiz();
</script>
